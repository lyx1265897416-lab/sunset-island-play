<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sunset Island · 日落岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--gold:#f1d6a6;--rose:#e9a9b5;--ink:#fbf6ee;--mute:#cfc6bb;--glass:#ffffff1f;--line:#ffffff33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;color:var(--ink);font:15px/1.45 Manrope,-apple-system,"PingFang SC",sans-serif;overflow:hidden;user-select:none}
#frame{position:relative;flex:none;width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16;overflow:hidden;overflow:clip;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .15s}
video.on{opacity:1}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
/* top bar */
#top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:20}
.pill{box-sizing:border-box;height:40px;min-width:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#0000004d;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);font:600 13px/1 Manrope,"PingFang SC",sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;margin:0;flex:none}
.pill.ic{width:40px;padding:0}.pill svg{display:block;width:18px;height:18px;flex:none}
.pill.off{opacity:.45}
#top .sp{flex:1}
/* captions */
#cap{position:absolute;left:7%;right:7%;bottom:calc(64px + 4%);text-align:center;pointer-events:none;z-index:6;text-shadow:0 1px 2px #000c,0 0 14px #0009}
#cap .who{font-size:10.5px;letter-spacing:.18em;color:var(--gold);font-weight:700;margin-bottom:1px}
#cap .en{font-size:17px;font-weight:600}
#cap .zh{font-size:14.5px;opacity:.92;margin-top:2px}
/* variety-show stickers */
#stk{position:absolute;inset:0;pointer-events:none;z-index:5}
.stk{position:absolute;transform:translate(-50%,-50%) scale(0);opacity:0;transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.stk.on{transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg));opacity:1}
.stk .drop{position:absolute;width:var(--w,34px);animation:slide 1.1s ease-in infinite}
.stk .drop:nth-child(2){animation-delay:.35s}.stk .drop:nth-child(3){animation-delay:.7s}
@keyframes slide{0%{transform:translateY(-6px) scale(.9)}60%{transform:translateY(10px) scale(1)}100%{transform:translateY(22px) scale(.85);opacity:0}}
.stk .word{font:900 38px/1 "PingFang SC","Hiragino Sans GB",Manrope,sans-serif;color:#fff;letter-spacing:.02em;white-space:nowrap;
  -webkit-text-stroke:2px #1d6fd8;paint-order:stroke fill;text-shadow:0 3px 0 #1d6fd8,0 6px 10px #0006;animation:wob .6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg) scale(1.05)}}
/* title cards */
#card{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:5;pointer-events:none;opacity:0;transition:opacity .6s}
#card.on{opacity:1}
#card .k{letter-spacing:.32em;font-size:11px;color:var(--ink);opacity:.9}
#card .t{font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1.05;margin-top:4px;text-shadow:0 2px 14px #0008}
/* meet toast */
#meet{position:absolute;top:56px;left:50%;transform:translate(-50%,-10px);opacity:0;transition:all .4s;z-index:21;display:flex;gap:10px;align-items:center;padding:6px 14px 6px 6px;border-radius:999px;background:#140f12cc;border:1px solid var(--line);backdrop-filter:blur(10px)}
#meet.on{opacity:1;transform:translate(-50%,0)}
#meet img{width:34px;height:34px;border-radius:50%;object-fit:cover}
#meet small{display:block;color:var(--gold);letter-spacing:.14em;font-size:10px}
#meet .ico{display:none}
#meet.tip{flex-direction:column;justify-content:center;align-items:center;gap:6px;border-radius:18px;padding:12px 20px;width:max-content;max-width:min(300px,calc(100% - 32px));box-sizing:border-box;top:64px}
#meet.tip img,#meet.tip small{display:none}
#meet.tip .ico{display:flex;align-items:center;justify-content:center;width:18px;height:18px;color:var(--gold)}
#meet.tip .ico svg{width:16px;height:16px}
#meet.tip>div{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#meet.tip .nm{text-align:center;font-size:14px;line-height:1.5;font-weight:500;text-wrap:balance}
/* scrim + choice */
#scrim{position:absolute;inset:0;background:linear-gradient(transparent 38%,#000c 82%);opacity:0;transition:opacity .35s;pointer-events:none;z-index:7}
#scrim.on{opacity:1}#scrim.full{background:#000b}
#choice{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(24px + env(safe-area-inset-bottom));z-index:8;transform:scale(.97);transform-origin:50% 100%;opacity:0;visibility:hidden;pointer-events:none;transition:all .35s}
#choice.on{transform:none;opacity:1;visibility:visible;pointer-events:auto}
#choice .q{text-align:center;margin-bottom:12px}
#choice .q small{display:block;letter-spacing:.24em;font-size:11px;color:var(--gold);margin-bottom:6px}
#choice .q b{font-size:21px;font-weight:600;line-height:1.25}
.opt{display:block;width:100%;margin:9px 0;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:#ffffff1c;backdrop-filter:blur(12px);color:var(--ink);font:600 15px Manrope,"PingFang SC";text-align:left;cursor:pointer}
.opt:active{background:var(--gold);color:#2a1f17}
.cards{display:flex;gap:10px}
.cardopt{flex:1;position:relative;aspect-ratio:3/5;border-radius:18px;overflow:hidden;border:1.5px solid #ffffff55;cursor:pointer;background:#222}
.cardopt img{width:100%;height:100%;object-fit:cover}
.cardopt .lbl{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 12px;background:linear-gradient(transparent,#000c);text-align:center}
.cardopt .lbl b{display:block;font-size:16px}.cardopt .lbl span{font-size:12px;color:var(--mute)}
.cardopt.locked img{filter:blur(8px) brightness(.6)}
.cardopt .lock{position:absolute;top:34%;left:0;right:0;text-align:center;font-family:"Cormorant Garamond",serif;font-size:20px}
/* QTE action ring */
#qte{position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom));z-index:9;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:scale(.96);pointer-events:none;transition:all .35s}
#qte.on{opacity:1;visibility:visible;transform:none;pointer-events:auto}
#ring{width:116px;height:116px;border-radius:50%;border:3px solid #ffffffb0;background:#00000040;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;touch-action:none;transition:transform .15s;box-shadow:0 0 0 0 #fff6;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffffff55}100%{box-shadow:0 0 0 22px #ffffff00}}
#ring.rec{font-size:0}#ring.rec::after{content:"";width:46px;height:46px;border-radius:50%;background:#ff4a4a}
#qte .arrow{margin-top:10px;opacity:.8}
#qte b{font-size:20px;margin-top:6px}#qte span{font-size:13px;color:var(--mute)}
/* panels */
.sheet{position:absolute;inset:0;background:linear-gradient(#1d1519,#120e10);z-index:30;transform:translateX(100%);transition:transform .3s;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:40px}
.sheet .hd small{display:block;letter-spacing:.2em;font-size:10.5px;color:var(--gold)}
.sheet .hd h2{margin:0;font-family:"Cormorant Garamond",serif;font-weight:400;font-size:36px}
.tabs{display:flex;gap:8px;margin:6px 0 12px}.tabs button{flex:1;height:36px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:600 13px Manrope}
.tabs button.on{background:#ffffff26;border-color:var(--rose)}
.row{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid #ffffff14}
.row img,.row .ph{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#ffffff12;display:flex;align-items:center;justify-content:center}
.row .nm{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1}
.row .sub{font-size:12px;color:var(--mute)}
.hearts{color:var(--rose);font-size:13px;letter-spacing:2px}
.ep{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #ffffff14;cursor:pointer}.ep b{font-family:"Cormorant Garamond",serif;font-size:30px;width:34px;text-align:center;color:var(--gold);font-weight:400}.ep .nm{font-size:16px;font-weight:600}.ep .sub{font-size:12px;color:var(--mute)}.ep.cur{background:#ffffff10;border-radius:12px}
.ward{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ward div{border-radius:14px;overflow:hidden;position:relative;aspect-ratio:3/5;background:#ffffff10}
.ward img{width:100%;height:100%;object-fit:cover}.ward .lk img{filter:blur(8px) brightness(.5)}.ward span{position:absolute;left:8px;bottom:8px;font-size:12px}
/* start / end */
.screen{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 24px calc(40px + env(safe-area-inset-bottom));background-size:cover;background-position:center}
.screen::before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000d 85%)}
.screen>*{position:relative}
.screen h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:46px;line-height:.95;margin:6px 0 4px}
.k2{letter-spacing:.28em;font-size:11px;color:var(--gold)}
.go{margin-top:20px;padding:13px 34px;border-radius:999px;border:0;background:linear-gradient(90deg,#e9a9b5,#9fc3c9);color:#1d1a1a;font:700 16px Manrope;cursor:pointer}
.ghost{cursor:pointer;margin-top:12px;padding:12px 26px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:600 14px Manrope}
#rtPaused{display:none!important}
#rtBar{z-index:10}
#loading{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;border:3px solid #fff3;border-top-color:#fff;animation:spin 1s linear infinite;display:none;z-index:3}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="frame">
  <video id="va" playsinline preload="auto"></video><video id="vb" playsinline preload="auto"></video>

  <div id="meet"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><img alt=""><div><small></small><div class="nm"></div></div></div>
  <div id="top">
    <button class="pill ic" id="bcc" aria-label="Captions">CC</button>
    <span class="sp"></span>
    <button class="pill" id="baff"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span id="afflbl">Affection</span></button>
    <button class="pill ic" id="bmenu" aria-label="Episodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </div>
  <div class="sheet" id="menu">
    <div class="hd"><button class="pill ic" id="menuback" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div><small id="menuk">EPISODES</small><h2 id="menut">Episodes</h2></div></div>
    <div id="eplist"></div>
  </div>
  <div class="screen" id="rcard" style="display:none;background:radial-gradient(circle at 50% 25%,#3a2a22,#0d0f11 72%);justify-content:center">
    <div class="k2" id="rck"></div><h1 id="rct" style="font-size:32px"></h1><div id="rcl" style="color:var(--mute);font-size:14px;margin:4px 0 10px"></div>
    <div id="rcrows" style="width:100%;text-align:left"></div><button class="go" id="rcgo"></button><button class="ghost" id="rcagain"></button>
  </div>
  <div class="sheet" id="aff">
    <div class="hd"><button class="pill ic" id="affback" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div><small id="affk">EVERY CONNECTION COUNTS</small><h2 id="afft">Affection</h2></div></div>
    <div class="tabs"><button class="on" data-t="h" id="th">Hearts</button><button data-t="w" id="tw">Wardrobe</button></div>
    <div id="affbody"></div>
  </div>
  <div class="screen" id="start">
    <div class="k2">SUNSET MATCH · DAY ONE</div><h1>Sunset<br>Island</h1><div id="sub"></div>
    <button class="go" id="go">▶ Play</button><div style="font-size:12px;color:var(--mute);margin-top:10px" id="hint0"></div>
  </div>
  <div class="screen" id="endc" style="display:none;background:radial-gradient(circle at 50% 30%,#3a2a22,#0d0f11 70%);justify-content:center">
    <div class="k2" id="endk"></div><h1 id="endt" style="font-size:38px"></h1><div id="ends"></div><button class="go" id="endgo"></button><button class="ghost" id="endagain"></button>
  </div>
</div>
<script src="rt-player.js"></script>
<script>
const Q = new URLSearchParams(location.search);
let LANG = Q.get('lang') || ((navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en');
const $ = s => document.querySelector(s);
const T = {en:{play:'▶ Play',hint:'Sound on · tap the picture to pause',aff:'Affection',affk:'EVERY CONNECTION COUNTS',hearts:'Hearts',ward:'Wardrobe',notmet:'Not met yet',locked:'Locked',meetu:'Meet in the story to unlock',you:'Your story',met:'YOU MET',ep:n=>`EPISODE ${n}`,again:'↺ Replay the day',eps:'Episodes',epsk:'CHOOSE AN EPISODE',now:'Now playing',end:'To be continued',next:'Next episode ▶',miss:'Not rendered yet — skip ▶',worn:'Worn',lockw:'Not unlocked'},
           zh:{play:'▶ 开始',hint:'请打开声音 · 点画面暂停',aff:'好感',affk:'每一段关系都算数',hearts:'心动',ward:'衣橱',notmet:'还没遇见',locked:'未解锁',meetu:'在剧情中遇见后解锁',you:'你的故事',met:'遇见了',ep:n=>`第 ${n} 集`,again:'↺ 重过这一天',eps:'选集',epsk:'选择一集',now:'正在播放',end:'未完待续',next:'下一集 ▶',miss:'这一段还没生成 · 跳过 ▶',worn:'已穿',lockw:'未解锁'}};
const t = k => T[LANG][k];
let look='W1', S, V = {}, cur = null, va = $('#va'), vb = $('#vb'), front = va, mode = 'idle', uiUp = false, met = new Set(), worn = new Set(['W1']), cc = true, rate = 1;
function cond(c){ if(!c) return true; const js = c.replace(/\band\b/g,'&&').replace(/\bor\b/g,'||').replace(/\bnot\b/g,'!');
  try { return !!Function('v','with(v){return ('+js+')}')(new Proxy(V,{has:()=>true,get:(o,k)=>k===Symbol.unscopables?undefined:(k in o?o[k]:'')})); } catch(e){ return false; } }
function apply(eff){ for (const [k,v] of Object.entries(eff||{})) { if (S.stats.includes(k) && typeof v==='number') V[k]=(V[k]||0)+v; else V[k]=v; } }
function variant(n){ const vs=n.variants||[]; if(vs.includes('W4')||vs.includes('W5')) return V.outfit==='C'?'W5':'W4'; if(vs.includes('W7')||vs.includes('W8')) return V.outfit7==='red'?'W7':'W8'; return vs[0]||'none'; }
function idleOf(n){ if(!n.idle) return null; if(typeof n.idle==='string') return n.idle; return n.idle[variant(n)]||Object.values(n.idle)[0]; }
function media(n){ const v=variant(n); return n.media[v]||Object.values(n.media)[0]; }
/* 预载：一组播放器轮换用。每段开播后，把它结束后可能接的片段（待机循环、下一节点、每个选项的去向）提前在后台缓冲（data-warm），
   片段结束时直接切到已缓冲好的那个，不再现下现播。CDN 不给跨域下载，所以用 <video> 自己缓冲。 */
const POOL=[va,vb];
for(let i=0;i<5;i++){ const e=document.createElement('video'); e.setAttribute('playsinline',''); e.playsInline=true; e.preload='auto'; vb.after(e); POOL.push(e); }
let WANT=new Set();
// 画质：高清（≤4 Mbps）/ 流畅（≤2 Mbps，同分辨率）。&q=hd / &q=lite 强制；否则按实测网速自动选，本次会话记住
let LITE = Q.get('q')==='lite' || (Q.get('q')!=='hd' && ((()=>{ try{ return sessionStorage.getItem('sis-q')==='lite'; }catch(_){ return false; } })()
  || (()=>{ const c=navigator.connection; return !!(c && ((c.downlink && c.downlink<6) || /2g|3g/.test(c.effectiveType||'') || c.saveData)); })()));  // 浏览器报告的网速（安卓 Chrome 有）
function dropWarm(){ POOL.forEach(e=>{ if(e!==front&&e.dataset.u){ e.pause(); e.removeAttribute('src'); delete e.dataset.u; delete e.dataset.warm; e.load(); } }); warming=null; if(cur) plan(cur); }
function goHD(why){ if(!LITE||Q.get('q')==='lite') return; LITE=false; try{ sessionStorage.setItem('sis-q','hd'); }catch(_){} dropWarm(); console.log('hd:',why); }
function goLite(why){ if(LITE||Q.get('q')==='hd') return; LITE=true; FAST=0; try{ sessionStorage.setItem('sis-q','lite'); }catch(_){} dropWarm(); console.log('lite:',why); }
/* 网速：每段正片从开播到整段下完，算“每秒下进几秒画面”。高清 <1.15 倍 → 流畅版；流畅版连续两段 >3 倍 → 回高清 */
let MEAS=null, FAST=0;
function measStart(v){ MEAS=v.loop?null:{v, t:performance.now(), b0:bufEnd(v)}; }
setInterval(()=>{ if(!MEAS||MEAS.v!==front||!front.duration) return; if(bufEnd(front)<front.duration-0.3) return;
  const sec=(performance.now()-MEAS.t)/1000, got=front.duration-MEAS.b0; MEAS=null; if(got<3||sec<0.3) return; const r=got/sec;
  if(!LITE&&r<1.15) goLite('rate '+r.toFixed(2)); else if(LITE&&r>3){ if(++FAST>=2) goHD('rate '+r.toFixed(2)); } else FAST=0; },300);
const absu=s=>{ const u=/^https?:/.test(s)?s:new URL('../'+s, location.href).href; return (LITE&&S&&S.lite&&S.lite[u])||u; };
const elFor=u=>POOL.find(e=>e.dataset.u===u);
function spare(){ return POOL.filter(e=>e!==front&&!WANT.has(e.dataset.u)).sort((a,b)=>(+a.dataset.t||0)-(+b.dataset.t||0))[0]||POOL.find(e=>e!==front); }
/* 预载 v2（防卡）：一次只缓冲一个；每个拿到首帧就暂停（不解码），缓冲到约 4 秒（或 15 秒超时）再缓冲下一个；
   当前正在看的片段多缓冲 6 秒（或下完）之前不开始后台预载，不和它抢带宽。顺序：待机循环 → 下一段 / 各选项去向。 */
const WARM_SEC=4; let QUEUE=[], warming=null;
function bufEnd(e){ try{ const b=e.buffered; return b.length? b.end(b.length-1):0; }catch(_){ return 0; } }
function warmDone(e){ return e.readyState>=3 && bufEnd(e)>=Math.min(WARM_SEC,(e.duration||WARM_SEC)-0.2); }
function warm(src){ if(!src) return; const u=absu(src); if(elFor(u)) return; const e=spare(); if(!e) return;
  e.dataset.u=u; e.dataset.t=Date.now(); e.addEventListener('loadeddata',()=>{ if(e.dataset.u===u&&e.dataset.warm&&e!==front){ e.pause(); try{ e.currentTime=0; }catch(_){} } },{once:true}); /* 拿到首帧就停：不解码、不走位，浏览器按 preload=auto 继续缓冲 */
  e.dataset.warm='1'; e.muted=true; e.loop=false; e.preload='auto'; e.src=u; e.playbackRate=0.07; warming=e; const p=e.play(); if(p) p.catch(()=>{}); }
function frontReady(){ if(!front.src) return true; if(front.loop) return front.readyState>=3;  // 待机循环能顺播就开始预载下一段
  return !!(front.duration && bufEnd(front)>=(LITE? front.duration-0.3 : Math.min(front.duration-0.3, front.currentTime+6))); }  // 当前片已多缓冲 6 秒（或下完）才开始后台预载；流畅版（慢网）要整段下完
setInterval(()=>{  // 预载调度：每 0.4 秒看一次

function target(id, eff){ const save=V; V=Object.assign({},V); apply(eff); let n=S.nodes[id], g=0;

/* 人物解锁按剧情进度：走到（或通过选集跳过）某人的登场节点之后，他就算“遇见了” */
let ORDER=null, MEETAT=null;
function syncMet(id){ if(!ORDER){ ORDER={}; Object.keys(S.nodes).forEach((k,i)=>ORDER[k]=i); MEETAT={};
    Object.entries(S.nodes).forEach(([k,n])=>[].concat(n.meet||[]).forEach(w=>{ if(MEETAT[w]==null||ORDER[k]<ORDER[MEETAT[w]]) MEETAT[w]=k; })); }
  const here=ORDER[id]; Object.entries(MEETAT).forEach(([w,k])=>{ if(ORDER[k]<here) met.add(w); }); }
function go(id){ const n=S.nodes[id]; if(!n) return; cur=id; uiUp=false; hideUI(); apply(n.enter); if(n.calc) calc(n.calc); syncMet(id);
  const ms=[].concat(n.meet||[]); if(ms.length) setTimeout(()=>{ if(cur===id) ms.forEach((w,i)=>setTimeout(()=>meet(w),i*2800)); },2500);

  if(n.rcard&&!Object.keys(n.media).length){ mode='end'; return showRCard(n); }

  mode='play'; swap(src,false).catch(()=>{}); setTimeout(()=>plan(id),1200); }
